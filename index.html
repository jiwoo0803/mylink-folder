
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLink - 나의 링크 모음</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
        h1 { color: #333; }
        p { color: #777; }
        a {
            display: block;
            background: #e8efff;
            color: #2455aa;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
        }
        a:hover { background: #d5e2ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MyLink</h1>
        <p>나만의 링크 모음 페이지</p>

        <a href="https://www.google.com">Google</a>
        <a href="https://www.naver.com">Naver</a>
        <a href="https://www.youtube.com">YouTube</a>
        <a href="https://www.github.com">GitHub</a>
    </div>
</body>
</html>
